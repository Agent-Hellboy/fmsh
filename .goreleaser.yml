version: 2

project_name: fmsh

builds:
  - binary: fmsh
    main: ./cmd/fmsh
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - GO111MODULE=on
      - CGO_ENABLED=0

release:
  prerelease: auto

universal_binaries:
  - id: fmsh-universal
    replace: true

brews:
  - name: fmsh
    homepage: "https://github.com/Agent-Hellboy/fmsh"
    description: "A black box recorder for AI-driven development on macOS"
    license: "GPL-3.0"
    repository:
      owner: "Agent-Hellboy"
      name: "fmsh"
    commit_author:
      name: "Prince Roshan"
      email: "princekrroshan01@gmail.com"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'