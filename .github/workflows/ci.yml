name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Ensure modules are downloaded
        run: |
          go mod download



          
      - name: Build binary
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            go build -o dist/fmsh-ubuntu ./cmd
          else
            go build -o dist/fmsh-macos ./cmd
          fi

      - name: Set artifact name
        id: set-artifact
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "artifact=fmsh-ubuntu" >> $GITHUB_OUTPUT
          else
            echo "artifact=fmsh-macos" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.artifact }}
          path: dist/${{ steps.set-artifact.outputs.artifact }}
