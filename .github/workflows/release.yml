name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # fmsh is macOS-only: GoReleaser builds the darwin binaries (and universal
  # binary) and publishes the release + Homebrew formula.
  goreleaser:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
